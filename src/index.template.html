        <div class="mb-3 flex items-center justify-between gap-4">

        </div>
        <img id="lightboxImage" alt="Project preview">

            <button type="button" id="lightboxPrev" class="nb-btn"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="ui.prev">Prev</span></button>

            <button type="button" id="lightboxNext" class="nb-btn"><span data-i18n="ui.next">Next</span> <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </dialog>
