<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('bahrul-portfolio-theme');
                document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
                document.documentElement.lang =
                    localStorage.getItem('bahrul-portfolio-lang') === 'en' ? 'en' : 'id';
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
                document.documentElement.lang = 'id';
            }
        })();
    </script>
    <meta charset="utf-8">
    <title>BAHRUL | PORTOFOLIO</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Portfolio of Ach. Bahrul Ma'arip - AI, Data Science & Full-Stack Developer" name="description">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, monospace;
            --color-ink: #0a0a0a;
            --color-paper: #ffffff;
            --color-smoke: #f4f4f5;
            --color-steel: #a1a1aa;
        }
    </style>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Small component layer (neobrutalist utilities) -->
    <link href="css/style.css" rel="stylesheet">
</head>
